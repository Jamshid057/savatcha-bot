name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: savatcha
          POSTGRES_PASSWORD: test
          POSTGRES_DB: savatcha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U savatcha"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://savatcha:test@localhost:5432/savatcha
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Migratsiyalar haqiqiy Postgres da o'tishi va modellar bilan mos kelishi tekshiriladi
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      # core testlari SQLite va haqiqiy Postgres (vaqt zonasi/agregat SQL) da
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://savatcha:test@localhost:5432/savatcha

