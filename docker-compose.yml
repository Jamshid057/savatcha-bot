# v1 (classic bot): bitta DB + bot. Profil: `classic`.
x-app: &app
  build: .
  env_file: .env
  volumes:
    - uploads:/data/uploads
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: savatcha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: savatcha
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savatcha"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    profiles: ["classic"]
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  bot:
    <<: *app
    profiles: ["classic"]
    command: python -m savatcha.bot.main
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
